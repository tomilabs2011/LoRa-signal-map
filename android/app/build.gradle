plugins {
    id "com.android.application"
}

android {
    namespace "com.tomilabs.lorasignalmap"
    compileSdk 34

    defaultConfig {
        applicationId "com.tomilabs.lorasignalmap"
        minSdk 29
        targetSdk 34
        // keep in sync with src/main/java/com/tomilabs/lorasignalmap/BuildInfo.java
        versionCode 2
        versionName "1.1.0"
    }

    // The release APK is signed with keystore/lorasignalmap.jks (kept out of git: the repo is public).
    // With the same key, Android Studio builds install over the released APK and keep the logs.
    def lsmKeystore = file("../keystore/lorasignalmap.jks")

    signingConfigs {
        lsm {
            storeFile lsmKeystore
            storePassword "lorasignalmap"
            keyAlias "lorasignalmap"
            keyPassword "lorasignalmap"
        }
    }

    buildTypes {
        debug {
            if (lsmKeystore.exists()) {
                signingConfig signingConfigs.lsm
            }
        }
        release {
            minifyEnabled false
            signingConfig lsmKeystore.exists() ? signingConfigs.lsm : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding "UTF-8"
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation "org.osmdroid:osmdroid-android:6.1.20"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16"
}
